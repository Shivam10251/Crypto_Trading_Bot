[project]
name = "trading-bot"
version = "0.1.0"
description = "Quantitative crypto arbitrage research and paper-trading platform"
requires-python = ">=3.12,<3.13"
license = "MIT"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "httpx>=0.28",
    "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[project.scripts]
trading-bot-api = "trading_bot.cli:run_api"
trading-bot-market-data = "trading_bot.cli:run_market_data"
trading-bot-purge = "trading_bot.cli:run_retention_purge"
trading-bot-recost = "trading_bot.cli:run_recost"
trading-bot-risk = "trading_bot.cli:run_risk_control"
trading-bot-backtest = "trading_bot.backtest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "requires_postgres: test needs a live PostgreSQL instance (skipped when absent)",
    "requires_network: test calls a live exchange API (opt in with TB_TEST_LIVE=1)",
]
filterwarnings = ["error::DeprecationWarning:trading_bot.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
packages = ["trading_bot"]
mypy_path = "src"
strict = true
warn_unreachable = true
