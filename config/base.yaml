# Base configuration shared by every profile.
# Profile files (development.yaml / paper.yaml / production.yaml) override these.
# Environment variables (TB_*) override both. Secrets belong ONLY in .env.

app:
  name: "Arbitrage Terminal"
  # Bound at runtime from the TB_PROFILE env var; kept here for documentation.
  profile: "development"

api:
  host: "127.0.0.1"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
  docs_enabled: true

logging:
  level: "INFO"
  # "console" = human-readable dev output, "json" = machine-parseable
  format: "console"
  # Events that must never be dropped, regardless of level.
  audit_events:
    - "risk.decision"
    - "order.submitted"
    - "order.filled"
    - "kill_switch.engaged"

database:
  host: "127.0.0.1"
  port: 5432
  name: "trading_bot"
  user: "trading_bot"
  # password comes from TB_DATABASE__PASSWORD in .env - never stored here
  pool_size: 10
  max_overflow: 5
  pool_timeout_seconds: 30
  echo_sql: false

exchange:
  # binance.com global endpoints (user is trading from India)
  venue: "binance"
  spot_rest_url: "https://api.binance.com"
  # WebSocket hosts. The adapter picks the path per stream kind: USD-M futures
  # serve bookTicker/depth under /public and the 24h ticker under /market.
  spot_ws_url: "wss://stream.binance.com:9443"
  futures_rest_url: "https://fapi.binance.com"
  futures_ws_url: "wss://fstream.binance.com"
  request_timeout_seconds: 10
  max_reconnect_backoff_seconds: 30

markets:
  # How markets are chosen. Never hard-code 50 symbols.
  #   top_volume - USDT pairs listed on both spot and perpetual, ranked by the
  #                weaker leg's 24h quote volume; the top `count` are monitored
  #   explicit   - exactly the symbol lists below
  # The symbol lists are monitored in either mode.
  selection: "top_volume"
  top_volume:
    count: 50
    quote_asset: "USDT"
    # Both legs must trade at least this much quote volume per day.
    min_quote_volume: 1000000
    # Pegged assets have no basis worth trading.
    exclude_base_assets: ["USDC", "FDUSD", "TUSD", "USDP", "DAI", "USDE", "PYUSD", "USD1", "EUR", "AEUR", "EURI"]
    exclude_symbols: []
  spot_symbols:
    - "BTCUSDT"
  perpetual_symbols:
    - "BTCUSDT"

market_data:
  # Phase 3 engine: top of book, diff-depth order books, rolling 24h volume.
  include_depth: true
  include_ticker: true
  # Levels published per side, and the REST snapshot depth that seeds each
  # local book. The book is only trusted inside the snapshot's price range,
  # and 100 spot BTC levels span roughly 12 USD - hence 1000.
  depth_levels: 20
  snapshot_depth: 1000
  # A connection silent for this long makes every market on it STALE.
  stale_after_ms: 2000
  # A market with no message of its own for this long is STALE even on a busy
  # connection. Binance only pushes changes, so a quiet market is unchanged,
  # not stale - this catches a single stream dying. Measured live: mid-cap spot
  # markets routinely go several seconds without a message.
  market_silence_ms: 30000
  # An open connection that delivers nothing for this long is treated as dead.
  idle_timeout_seconds: 10
  # Snapshots in flight at once; a 1000-level spot snapshot costs 50 of the
  # 6000 request weight allowed per minute.
  max_concurrent_snapshots: 4
  # Liquidity = resting value within this band of the mid, from the full book.
  liquidity_band_bps: 10
  # Market-order size (quote currency) used to quote slippage.
  reference_order_notional: 10000
  # Sampled quotes go to market_data once per interval, only when changed.
  # ~290 bytes a row: 100 markets at 5 s is about 500 MB a day.
  persist: true
  persist_interval_ms: 5000
  # The API calls a market live when its newest stored quote is this recent.
  status_fresh_within_ms: 15000

monitoring:
  # Phase 4: every market sampled on this cadence...
  sample_interval_ms: 1000
  # ...with spread/imbalance means and latency percentiles over this window.
  window_seconds: 60

strategy:
  # First strategy (Phase 5): spot vs perpetual futures basis / relative value.
  enabled:
    - "spot_perp_basis"
  # Run the enabled strategies inside the market-data service and show what
  # they see. Detection only - nothing is executed before Phase 8.
  evaluate: true
  display: true
  evaluate_interval_ms: 1000
  spot_perp_basis:
    # Required edge AFTER every cost. Gross spread is never traded on.
    min_net_edge_bps: 1.0
    # Size each opportunity is evaluated at, capped again by what the thinner
    # leg's book can absorb. The risk engine re-checks this in Phase 9.
    max_notional_usd: 1000
    # Selling the spot leg needs inventory or a margin borrow. On a plain spot
    # account only "buy spot, sell perp" is reachable; the other direction is
    # still detected and priced as research data, but never signalled.
    allow_spot_short: false
    # Both legs must be this fresh and this fast, or the basis describes a
    # market that has already moved on.
    max_data_age_ms: 2000
    max_latency_ms: 500
    signal_ttl_ms: 500
    # Assumed holding period for the perpetual leg, used to charge funding.
    # Over minutes funding is negligible beside fees; over days it dominates.
    funding_horizon_minutes: 60
    # Bulk funding poll: weight 10 however many markets are monitored.
    funding_refresh_seconds: 60

costs:
  # Binance spot taker fee and USDⓈ-M perp taker fee, in basis points.
  spot_taker_fee_bps: 10.0
  perp_taker_fee_bps: 5.0
  # Extra margin subtracted from every edge so gross spread is never traded on.
  safety_buffer_bps: 2.0

risk:
  max_order_notional_usd: 1000.0
  max_position_notional_usd: 5000.0
  max_total_exposure_usd: 10000.0
  max_daily_loss_usd: 200.0
  max_consecutive_losses: 5
  max_slippage_bps: 15.0
  max_latency_ms: 500
  max_stale_data_ms: 2000

retention:
  # Raw market data is high volume and low long-term value: keep a working
  # window, not everything forever. Opportunities, orders, fills, positions,
  # P&L and events are never purged - they are the research record.
  enabled: true
  market_data_days: 7
  order_books_days: 3
  trades_market_days: 7
  purge_batch_size: 10000

execution:
  # "paper" or "live". Live requires the explicit opt-in below AND a production profile.
  mode: "paper"
  live_enabled: false
  live_confirmation_phrase: ""
